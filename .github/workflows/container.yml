name: Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC. The no-cache build picks up Fedora security updates using pinned CLIs.
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Default to read-only. The build job needs package write access for publishing.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          for script in scripts/install-clis.sh tests/*.sh; do
            sh -n "$script"
          done

      - name: Test checksum safeguards
        run: sh tests/checksums.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          push: false
          no-cache: true
          pull: true
          provenance: false
          tags: opencode-reviewer:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test image
        run: |
          docker run --rm --mount "type=bind,source=$PWD/tests,target=/tests,readonly" opencode-reviewer:test sh /tests/smoke.sh

      # Decide what to publish. Only main and v* tags publish, never pull requests.
      # Main publishes latest. Version tags never move latest.
      - name: Plan publish
        id: plan
        run: |
          set -eu
          publish=false
          tags=""
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            case "$GITHUB_REF" in
              refs/heads/main)
                publish=true
                tags="latest sha-$GITHUB_SHA"
                ;;
              refs/tags/v*)
                publish=true
                tags="$GITHUB_REF_NAME sha-$GITHUB_SHA"
                ;;
            esac
          fi
          # GHCR requires lowercase image names.
          image=$(printf '%s' "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          printf 'PUBLISH_IMAGE=%s\nPUBLISH_TAGS=%s\n' "$image" "$tags" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -eu
          # PUBLISH_TAGS is a space-separated list of tags without spaces, so word splitting is intended.
          for tag in $PUBLISH_TAGS; do
            docker tag opencode-reviewer:test "$PUBLISH_IMAGE:$tag"
            docker push "$PUBLISH_IMAGE:$tag"
          done
